name: Test Release (Signed APK)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g., 1.3.2-test)'
        required: false
        default: ''

jobs:
  build_test_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo "$ENCODED_STRING" | base64 -d > release.keystore
          echo "Keystore decoded successfully."
        else
          echo "KEYSTORE_BASE64 secret is not set. APK will not be signed."
        fi

    - name: Build Signed Release APK
      env:
        APP_VERSION_NAME: ${{ github.event.inputs.version_name != '' && github.event.inputs.version_name || '' }}
        BUILD_NUMBER: ${{ github.run_number }}
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Rename APK
      run: |
        VERSION="${{ github.event.inputs.version_name }}"
        if [ -z "$VERSION" ]; then
          VERSION="test-build-${{ github.run_number }}"
        fi
        mv app/build/outputs/apk/release/app-release.apk "moodgleam-${VERSION}.apk"
        echo "APK_NAME=moodgleam-${VERSION}.apk" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APK_NAME }}
        path: ${{ env.APK_NAME }}
        retention-days: 14
